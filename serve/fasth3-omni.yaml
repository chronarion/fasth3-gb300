# FastH3 Omni BF16 (text + ordered image/video/audio refs -> video+audio) on one GB300.
# Model dir composed by tools/download_models.sh (symlinks): Omni transformer_ref + schedulers + contract, and the
# byte-identical base components from FastH3-8-Step-V2 ($HF_HOME/composed/fasth3-omni-8step-v1).
# Pipeline settings (8 fused PDD blocks, VSA sparsity/tiles, ref keep rate) come from the
# composed dir's fastvideo_inference.json. Everything resident: ~138 GB in 252 GB HBM.
generator:
  model_path: /root/.cache/huggingface/composed/fasth3-omni-8step-v1
  engine:
    num_gpus: 1
    use_fsdp_inference: false
    parallelism:
      tp_size: 1
      sp_size: 1
    offload:
      dit: false
      dit_layerwise: false
      text_encoder: false
      image_encoder: false
      vae: false
      pin_cpu_memory: true    # FastVideo's default; pinned frame buffers (pageable D2H copies stall on GB300)
  pipeline:
    workload_type: i2v
    components:
      override_pipeline_cls_name: MiniMaxH3Ref2VAModularPipeline
    experimental:
      attention_backend: VIDEO_SPARSE_ATTN_H3

server:
  host: 0.0.0.0
  port: 8101
  media_roots: [/media]   # local reference files callers may use
  output_dir: /media/out/fasth3-omni
  served_model_name: fasth3-omni

default_request:
  negative_prompt: ""
  sampling:
    height: 768
    width: 1344
    num_frames: 124
    fps: 24
    num_inference_steps: 8
    guidance_scale: 1.0
    batch_cfg: false
    seed: 1234
  output:
    return_frames: false
