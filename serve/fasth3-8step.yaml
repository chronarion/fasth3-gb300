# FastH3 8-Step V2 (text -> video+audio) on one GB300. Adapted from FastVideo's
# examples/serving/openai_fasth3_8step.yaml (4x B200, sp_size 4): single GPU, sp 1, and no
# offload, because transformer + text encoder + VAEs (~134 GB) all fit in 252 GB of HBM.
generator:
  model_path: /root/.cache/huggingface/hub/models--FastVideo--FastVideo-FastH3-8-Step-V2/snapshots/3da2ddfe1954d9cda4c05b643dc0f26007a655c5
  engine:
    num_gpus: 1
    use_fsdp_inference: false
    parallelism:
      tp_size: 1
      sp_size: 1
    offload:
      dit: false
      dit_layerwise: false
      text_encoder: false
      image_encoder: false
      vae: false
      pin_cpu_memory: true    # FastVideo's default; pinned frame buffers (pageable D2H copies stall on GB300)
    compile:
      enabled: false
      vae_enabled: false
  pipeline:
    workload_type: t2v
    experimental:
      attention_backend: VIDEO_SPARSE_ATTN_H3
      VSA_sparsity: 0.8
      VSA_tile_size: 64
      inference_torch_compile: false
      vae_parallel_decode: false

server:
  host: 0.0.0.0
  port: 8101
  media_roots: [/media]   # local reference files callers may use
  output_dir: /media/out/fasth3
  served_model_name: fasth3

default_request:
  negative_prompt: ""
  sampling:
    height: 768
    width: 1344
    num_frames: 124
    fps: 24
    num_inference_steps: 9
    guidance_scale: 1.0
    batch_cfg: false
    seed: 1000
  output:
    return_frames: false
